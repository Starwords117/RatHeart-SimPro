# 三平台桌面版发布(Tauri):push tag v* 触发。
# 产物上传到 Draft Release,真机验收后在 GitHub 页面转正式。
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04        # 22.04 出 deb,兼容更老 glibc
            args: --bundles deb,appimage,rpm
          - platform: windows-latest      # NSIS 中文向导(WebView2 缺失时自动装)
            args: --bundles nsis
          - platform: macos-latest        # universal 二进制(x86_64 + aarch64 一体)
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 打包依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: 前端核验与构建
        run: |
          npm ci
          npm run check
          npm run build
      - name: Node 侧核验(仅 Linux,避开 Windows 路径差异)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RatHeart-SimPro ${{ github.ref_name }}'
          releaseBody: '大鼠心血管药理实验模拟桌面版(Tauri)。完整发布说明见 docs/RELEASE_NOTES_v0.2.0.md。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成 SHA256SUMS 并上传到 Draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --dir assets --clobber
          cd assets && sha256sum * > ../SHA256SUMS.txt && cd ..
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
