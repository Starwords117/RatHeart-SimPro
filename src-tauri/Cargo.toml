[package]
name = "ratheart-simpro"
version = "0.2.1"
edition = "2021"
description = "RatHeart-SimPro 大鼠心血管药理实验模拟桌面版(Tauri 试点)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratheart-server = { path = "../crates/ratheart-server" }
